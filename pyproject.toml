[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "streamlit-jsme"
version = "0.1.6"
description = "JSME molecule editor as a Streamlit V2 custom component"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.9"
authors = [
    { name = "Chanin Nantasenamat", email = "chanin.nantasenamat@snowflake.com" },
]
keywords = ["streamlit", "chemistry", "molecule", "JSME", "SMILES", "cheminformatics"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Topic :: Scientific/Engineering :: Chemistry",
]
dependencies = [
    "streamlit>=1.45",
]

[project.urls]
Homepage = "https://github.com/dataprofessor/streamlit-jsme"
Issues   = "https://github.com/dataprofessor/streamlit-jsme/issues"

[tool.hatch.build.targets.wheel]
packages = ["streamlit_jsme"]

